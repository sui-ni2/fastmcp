name: Repair ty source diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-ty-source.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete dedupe state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("fastmcp_slim/fastmcp/utilities/openapi/schemas.py")
          s = p.read_text()
          old = "                # Remove duplicates while preserving order\n                seen = set()\n                body_schema[\"required\"] = list(dict.fromkeys(merged_required))\n"
          new = "                # Remove duplicates while preserving order\n                body_schema[\"required\"] = list(dict.fromkeys(merged_required))\n"
          assert s.count(old) == 1, "unexpected schemas.py post-fix shape"
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          python -m compileall -q fastmcp_slim/fastmcp/utilities/openapi/schemas.py
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastmcp_slim/fastmcp/utilities/openapi/schemas.py
          git commit -m "fix: remove obsolete dedupe state"
          git push origin HEAD:main
