name: Investigate 4850

on:
  push:
    branches:
      - investigate-4850-current-main

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: python -m pip install uv
      - name: Verify token-swap and HS256 behavior
        run: |
          uv run python - <<'PY'
          import asyncio
          import time
          from unittest.mock import patch

          from key_value.aio.stores.memory import MemoryStore
          from mcp.server.auth.provider import AuthorizationCode
          from mcp.shared.auth import OAuthClientInformationFull
          from pydantic import AnyUrl

          from fastmcp.server.auth import AccessToken, TokenVerifier
          from fastmcp.server.auth.oidc_proxy import OIDCConfiguration, OIDCProxy
          from fastmcp.server.auth.oauth_proxy.models import ClientCode

          CONFIG = OIDCConfiguration.model_validate({
              "issuer": "https://idp.example.com/application/o/my-app/",
              "authorization_endpoint": "https://idp.example.com/application/o/authorize/",
              "token_endpoint": "https://idp.example.com/application/o/token/",
              "jwks_uri": "https://idp.example.com/application/o/my-app/jwks/",
              "response_types_supported": ["code"],
              "subject_types_supported": ["public"],
              "id_token_signing_alg_values_supported": ["RS256", "HS256"],
          })

          class AcceptVerifier(TokenVerifier):
              async def verify_token(self, token: str):
                  return AccessToken(
                      token=token,
                      client_id="upstream-client",
                      scopes=["read"],
                      expires_at=int(time.time()) + 3600,
                      claims={"sub": "user-1"},
                  )

          async def verify_generic_swap():
              with patch.object(
                  OIDCConfiguration,
                  "get_oidc_configuration",
                  return_value=CONFIG,
              ):
                  proxy = OIDCProxy(
                      config_url="https://idp.example.com/application/o/my-app/.well-known/openid-configuration",
                      client_id="my-app",
                      client_secret="secret",
                      base_url="https://mcp.example.com/my-service",
                      token_verifier=AcceptVerifier(),
                      client_storage=MemoryStore(),
                  )
              proxy.set_mcp_path("/mcp")
              client = OAuthClientInformationFull(
                  client_id="mcp-client",
                  client_secret="mcp-secret",
                  redirect_uris=[AnyUrl("http://localhost/callback")],
              )
              await proxy.register_client(client)
              now = time.time()
              await proxy._code_store.put(
                  key="code",
                  value=ClientCode(
                      code="code",
                      client_id="mcp-client",
                      redirect_uri="http://localhost/callback",
                      code_challenge=None,
                      code_challenge_method="S256",
                      scopes=["read"],
                      idp_tokens={
                          "access_token": "upstream-access-token",
                          "expires_in": 3600,
                          "scope": "read",
                          "token_type": "Bearer",
                      },
                      expires_at=now + 300,
                      created_at=now,
                  ),
                  ttl=300,
              )
              auth_code = AuthorizationCode(
                  code="code",
                  client_id="mcp-client",
                  redirect_uri=AnyUrl("http://localhost/callback"),
                  redirect_uri_provided_explicitly=True,
                  scopes=["read"],
                  expires_at=now + 300,
                  code_challenge="",
              )
              issued = await proxy.exchange_authorization_code(client, auth_code)
              loaded = await proxy.verify_token(issued.access_token)
              assert loaded is not None
              assert loaded.token == "upstream-access-token"
              print("GENERIC_SWAP=PASS")

          def verify_hs256_constructor():
              with patch.object(
                  OIDCConfiguration,
                  "get_oidc_configuration",
                  return_value=CONFIG,
              ):
                  try:
                      OIDCProxy(
                          config_url="https://idp.example.com/application/o/my-app/.well-known/openid-configuration",
                          client_id="my-app",
                          client_secret="secret",
                          base_url="https://mcp.example.com/my-service",
                          algorithm="HS256",
                          client_storage=MemoryStore(),
                      )
                  except ValueError as exc:
                      print(f"HS256_CONSTRUCTOR=FAIL:{exc}")
                      assert "Symmetric HS* algorithms cannot be used with jwks_uri" in str(exc)
                  else:
                      raise AssertionError("Expected current-main HS256 OIDCProxy construction to fail")

          asyncio.run(verify_generic_swap())
          verify_hs256_constructor()
          PY
